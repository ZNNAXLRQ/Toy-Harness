[project]
name = "toy-harness"
version = "0.1.0"
description = "Toy Harness —— 最小可用的 Agent Harness（FastAPI + SQLite）"
readme = "README.md"
requires-python = ">=3.11"

# 运行期依赖：生产环境必须安装，也是唯一的依赖真源
dependencies = [
    # Web 层：REST + SSE + 表单（审批接口）
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.20",

    # 模型与配置：DTO / 领域模型 + YAML / 环境变量配置
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",

    # 网络：http_tool 与各 provider 的流式调用
    "httpx>=0.27",

    # LLM SDK：openai 同时覆盖 OpenAI 与 DeepSeek（兼容接口），anthropic 覆盖 Claude
    "openai>=1.54",
    "anthropic>=0.39",

    # 持久化：异步 SQLite，避免同步驱动阻塞事件循环
    "aiosqlite>=0.20",

    # 上下文管理：token 预算与摘要触发所需的 tokenizer
    "tiktoken>=0.8",
]

# 开发期依赖：不进入生产环境；pip 不认识这一段，必须用 uv sync 安装
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
]

[tool.uv]
# 纯应用，只装依赖、不把项目本身构建成包，避免 flat-layout 自动发现报错
package = false

[tool.pytest.ini_options]
# 让测试可以直接 import app，无需 editable 安装
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
