name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # --frozen：锁文件与 pyproject.toml 不一致时直接失败，避免 CI 偷偷改锁文件
      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q
