name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # --locked 会在 pyproject 与锁文件不一致时**失败**；--frozen 不会，它只是不更新锁。
      # 这里要的是「锁文件必须是提交时就最新的」。
      - name: Install dependencies
        run: uv sync --locked

      # --no-sync：测试步骤不允许隐式改依赖，环境必须是上一步装好的那个。
      # -ra：把 skip 原因打到日志里——SQLite 契约用例的 skip 必须看得见，
      #      否则「交付了没验收」会一直看起来是绿的。
      - name: Run tests
        run: uv run --no-sync pytest -q -ra
