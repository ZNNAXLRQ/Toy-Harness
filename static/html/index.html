<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>聊天 · Toy Harness</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../css/index.css">
  <script type="module" src="../js/app.js"></script>
</head>
<body>
  <a href="#main" class="skip" id="skip">跳至主要内容</a>
  <div id="sidebar-slot"></div>
  <main id="main" tabindex="-1">
    <header class="masthead">
      <div><h1 id="page-title" tabindex="-1">聊天与实时事件</h1><p>发送演示消息，并在同一时间线查看模型、工具与审批事件。</p></div>
      <div class="header-tools"><label class="workspace" for="session-select"><span class="sr-only">当前会话</span><select id="session-select" disabled><option>加载中…</option></select></label><span class="badge mode">示例模式</span><span class="avatar" aria-hidden="true">U</span></div>
    </header>
    <div class="content">
      <div id="error" class="notice error" role="alert" hidden></div>
      <p id="storage-warning" class="notice error" role="alert" hidden>无法读取或保存标签页状态；此时换页或刷新可能丢失演示进度。</p>
      <div id="status" class="sr-only" role="status"></div>
      <p id="loading" class="empty">正在加载本地演示…</p>
      <button type="button" id="retry" hidden>重试</button>
      <div id="page" data-page="chat" aria-busy="true" hidden>
        <div class="grid split">
          <section class="card chat-panel" aria-labelledby="messages-title">
            <div class="section-head"><div><h2 id="messages-title">当前对话</h2><p id="chat-session" class="meta"></p></div><span id="session-status"></span></div>
            <div id="chat-stream" class="chat-stream" tabindex="0" aria-label="消息历史"></div>
            <div id="recovery" class="composer actions" hidden><span id="recovery-action"></span><a href="context.html" data-current-session>上下文与恢复</a></div>
            <form id="composer" class="composer stack">
              <label class="field" for="message"><span class="sr-only">消息</span><textarea id="message" rows="1" maxlength="4000" placeholder="输入演示消息…" required></textarea></label>
              <div class="actions">
                <button type="button" id="write" data-focus="write">模拟更新便笺</button>
                <button type="submit" id="send" class="primary" data-focus="send">发送消息</button>
              </div>
            </form>
          </section>
          <section class="card panel event-panel" aria-labelledby="events-title">
            <div class="section-head"><div><h2 id="events-title">实时事件</h2><p class="meta">本地时间线 · 最新在前</p></div><label class="field" for="event-filter"><span class="sr-only">事件类型</span><select id="event-filter"></select></label></div>
            <div class="event-stream" id="event-stream" tabindex="0" aria-label="实时事件历史"></div>
          </section>
        </div>
      </div>
      <noscript><p class="notice error">此演示需要启用 JavaScript。</p></noscript>
    </div>
    <footer>本地演示 · 不连接后端</footer>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description">
    <header class="dialog-head"><span class="dialog-mark" aria-hidden="true">!</span><div><h2 id="dialog-title"></h2><p id="dialog-description"></p></div><button type="button" id="dialog-close" class="icon-button" aria-label="关闭弹窗" autofocus>×</button></header>
    <div id="dialog-body"></div>
    <p id="dialog-error" class="notice error" role="alert" hidden></p>
    <div id="dialog-actions" class="actions dialog-actions"></div>
  </dialog>
</body>
</html>
