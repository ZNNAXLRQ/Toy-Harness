<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f6f8" />
    <title>Toy Harness — Agent 工具调用工作台</title>
    <link rel="stylesheet" href="/static/css/index.css" />
    <script src="/static/js/index.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Toy Harness 首页">
          <span class="brand-mark" aria-hidden="true"
            ><span></span><span></span><span></span
          ></span>
          <span class="brand-name">toy<span>/</span>harness</span>
        </a>
        <div class="topbar-meta">
          <span class="environment-dot"></span
          ><span id="provider-label">正在连接</span
          ><span class="meta-divider"></span
          ><span class="topbar-caption">Agent 工作台</span>
        </div>
      </header>

      <section class="workspace" aria-label="Agent 执行工作台">
        <section class="conversation panel" aria-labelledby="task-title">
          <header class="panel-heading">
            <div><h1 id="task-title">运行一个任务</h1></div>
            <span
              id="run-state"
              class="state-pill"
              role="status"
              aria-live="polite"
              ><i></i>就绪</span
            >
          </header>

          <form id="run-form" class="composer">
            <label for="prompt">任务指令</label>
            <textarea
              id="prompt"
              name="prompt"
              rows="5"
              placeholder="描述你希望 Agent 完成的任务…"
              required
            ></textarea>
            <button id="demo-example" class="demo-example" type="button" hidden>
              填入演示任务 <span aria-hidden="true">↗</span>
            </button>
            <div class="composer-footer">
              <div class="mode-picker" role="group" aria-label="工具调用权限">
                <button
                  class="mode-option is-selected"
                  type="button"
                  data-mode="approval"
                  aria-pressed="true"
                >
                  需要审批
                </button>
                <button
                  class="mode-option"
                  type="button"
                  data-mode="full"
                  aria-pressed="false"
                >
                  全权限
                </button>
              </div>
              <button id="run-button" class="run-button" type="submit">
                <span>运行任务</span><span aria-hidden="true">↗</span>
              </button>
            </div>
            <p id="mode-note" class="form-note">
              读取与目录查看会自动执行；写入文件前会展示完整参数并等待你的决定。
            </p>
            <p id="form-error" class="form-error" role="alert" hidden></p>
          </form>

          <div class="conversation-divider">
            <span>本轮对话</span><span class="divider-line"></span>
          </div>
          <div
            id="conversation-feed"
            class="conversation-feed"
            aria-live="polite"
            aria-relevant="additions text"
          >
            <div class="empty-conversation">
              <span class="empty-icon" aria-hidden="true">↳</span>
              <p>任务的消息与审批会显示在这里。</p>
              <span>执行过程由服务端事件实时驱动</span>
            </div>
          </div>
        </section>

        <aside class="trace-panel panel" aria-labelledby="trace-title">
          <header class="panel-heading trace-heading">
            <div><h2 id="trace-title">执行轨迹</h2></div>
            <span class="trace-counter"
              ><span id="event-count">0</span> 个事件</span
            >
          </header>
          <div class="trace-summary">
            <span class="summary-line"></span>
            <p>Agent 的每一步都在这里留下记录。</p>
          </div>
          <ol
            id="event-timeline"
            class="timeline"
            aria-label="执行事件时间线"
            aria-live="polite"
            aria-relevant="additions text"
          ></ol>
          <div id="timeline-empty" class="timeline-empty">
            <span class="timeline-empty-mark" aria-hidden="true">·</span>
            <p>等待任务开始</p>
            <span>请求、审批和工具结果将按顺序出现</span>
          </div>
          <div id="stream-indicator" class="stream-indicator">
            <span class="stream-dot"></span><span>事件流未连接</span>
          </div>
        </aside>
      </section>
      <footer class="page-footer">工具调用实时记录 · 写入前由你决定</footer>
    </main>
  </body>
</html>
