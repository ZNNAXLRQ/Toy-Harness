<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f6f8" />
    <title>Toy Harness — Agent 工具调用工作台</title>
    <link rel="stylesheet" href="/static/css/index.css" />
    <script src="/static/js/index.js" defer></script>
  </head>
  <body>
    <main class="app-shell workspace-shell">
      <aside class="workspace-sidebar" aria-label="主导航">
        <a class="brand" href="/" aria-label="Toy Harness 首页">
          <span class="brand-mark" aria-hidden="true"
            ><span></span><span></span><span></span
          ></span>
          <span class="brand-name">Toy Harness</span>
        </a>
        <button id="new-session" class="new-session-button" type="button">
          <span aria-hidden="true">＋</span> 新建会话
        </button>
        <nav class="workspace-nav" aria-label="工作区">
          <button type="button" data-workspace-view="chat" aria-current="page">
            <span aria-hidden="true">▤</span> 对话
          </button>
          <button type="button" data-workspace-view="sessions">
            <span aria-hidden="true">◷</span> 会话记录
          </button>
          <button type="button" data-workspace-view="tools">
            <span aria-hidden="true">⌘</span> 工具
          </button>
          <button type="button" data-workspace-view="rollback">
            <span aria-hidden="true">↶</span> 回滚
          </button>
          <button type="button" data-workspace-view="subagents">
            <span aria-hidden="true">♧</span> 子 Agent
          </button>
          <button type="button" data-workspace-view="audit">
            <span aria-hidden="true">☷</span> 审计日志
          </button>
          <button type="button" data-workspace-view="settings">
            <span aria-hidden="true">⚙</span> 设置
          </button>
        </nav>
        <div class="sidebar-profile">
          <span class="profile-avatar" aria-hidden="true">U</span>
          <span class="profile-copy"><strong>本地工作区</strong></span>
        </div>
      </aside>

      <div class="workspace-main">
        <header class="topbar workspace-topbar">
          <div class="workspace-topbar-title">
            <h1>聊天工作台</h1>
            <p>跟踪 Agent 进度、工具调用和审批状态。</p>
          </div>
          <div class="topbar-meta">
            <span class="environment-dot" aria-hidden="true"></span>
            <span id="provider-label">正在连接</span>
          </div>
        </header>

        <section class="workspace workspace-grid" aria-label="Agent 执行工作台">
          <section
            id="chat-conversation"
            class="conversation panel"
            aria-labelledby="task-title"
          >
            <header class="panel-heading">
              <div>
                <h2 id="task-title">当前对话</h2>
                <p id="session-title" class="session-title">新会话</p>
              </div>
              <span
                id="run-state"
                class="state-pill"
                role="status"
                aria-live="polite"
                ><i></i>就绪</span
              >
            </header>

            <div
              id="conversation-feed"
              class="conversation-feed"
              aria-live="polite"
              aria-relevant="additions text"
            >
              <div class="empty-conversation">
                <span class="empty-icon" aria-hidden="true">↳</span>
                <p>任务的消息与审批会显示在这里。</p>
                <span>执行过程由服务端事件实时驱动</span>
              </div>
            </div>

            <form id="run-form" class="composer">
              <div class="composer-footer">
                <div class="mode-picker" role="group" aria-label="工具调用权限">
                  <button
                    class="mode-option is-selected"
                    type="button"
                    data-mode="approval"
                    aria-pressed="true"
                  >
                    需要审批
                  </button>
                  <button
                    class="mode-option"
                    type="button"
                    data-mode="full"
                    aria-pressed="false"
                  >
                    全权限
                  </button>
                </div>
                <button
                  id="demo-example"
                  class="demo-example"
                  type="button"
                  hidden
                >
                  填入演示任务 <span aria-hidden="true">↗</span>
                </button>
              </div>
              <div class="composer-input">
                <label for="prompt">任务指令</label>
                <textarea
                  id="prompt"
                  name="prompt"
                  rows="2"
                  placeholder="描述你希望 Agent 完成的任务…"
                  required
                ></textarea>
                <button id="run-button" class="run-button" type="submit">
                  <span>发送</span><span aria-hidden="true">↗</span>
                </button>
              </div>
              <p id="mode-note" class="form-note">
                读取自动执行，写入前等待审批。
              </p>
              <p id="form-error" class="form-error" role="alert" hidden></p>
            </form>
          </section>

          <section
            id="workspace-view"
            class="workspace-view panel"
            aria-labelledby="workspace-view-title"
            hidden
          >
            <header class="panel-heading">
              <h2 id="workspace-view-title">工作区</h2>
            </header>
            <div
              id="workspace-view-content"
              class="workspace-view-content"
            ></div>
          </section>

          <aside class="trace-panel panel" aria-labelledby="trace-title">
            <header class="panel-heading trace-heading">
              <div><h2 id="trace-title">执行轨迹</h2></div>
              <span class="trace-counter"
                ><span id="event-count">0</span> 个事件</span
              >
            </header>
            <div class="trace-summary">
              <span class="summary-line"></span>
              <p>Agent 的每一步都在这里留下记录。</p>
            </div>
            <ol
              id="event-timeline"
              class="timeline"
              aria-label="执行事件时间线"
              aria-live="polite"
              aria-relevant="additions text"
            ></ol>
            <div id="timeline-empty" class="timeline-empty">
              <span class="timeline-empty-mark" aria-hidden="true">·</span>
              <p>等待任务开始</p>
              <span>请求、审批和工具结果将按顺序出现</span>
            </div>
            <div id="stream-indicator" class="stream-indicator">
              <span class="stream-dot"></span><span>事件流未连接</span>
            </div>
          </aside>
        </section>
      </div>

      <template id="agent-progress-template">
        <section class="agent-progress" aria-label="Agent 进度">
          <h2>Agent 进度</h2>
          <dl>
            <div>
              <dt>阶段</dt>
              <dd data-agent-phase>等待开始</dd>
            </div>
            <div>
              <dt>当前工具</dt>
              <dd data-agent-tool>暂无</dd>
            </div>
            <div>
              <dt>观察结果</dt>
              <dd data-agent-observation>等待事件</dd>
            </div>
            <div>
              <dt>下一步</dt>
              <dd data-agent-next>等待事件</dd>
            </div>
          </dl>
        </section>
      </template>
    </main>
  </body>
</html>
