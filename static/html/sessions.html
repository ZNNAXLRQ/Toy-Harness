<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>会话与恢复 · Toy Harness</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../css/sessions.css">
  <script type="module" src="../js/app.js"></script>
</head>
<body>
  <a href="#main" class="skip" id="skip">跳至主要内容</a>
  <div id="sidebar-slot"></div>
  <main id="main" tabindex="-1">
    <header class="masthead">
      <div><h1 id="page-title" tabindex="-1">会话与恢复</h1><p>切换独立会话、查看历史，并继续挂起的演示轮次。</p></div>
      <div class="header-tools"><label class="workspace" for="session-select"><span class="sr-only">当前会话</span><select id="session-select" disabled><option>加载中…</option></select></label><span class="badge mode">示例模式</span><span class="avatar" aria-hidden="true">U</span></div>
    </header>
    <div class="content">
      <div id="error" class="notice error" role="alert" hidden></div>
      <p id="storage-warning" class="notice error" role="alert" hidden>无法读取或保存标签页状态；此时换页或刷新可能丢失演示进度。</p>
      <div id="status" class="sr-only" role="status"></div>
      <p id="loading" class="empty">正在加载本地演示…</p>
      <button type="button" id="retry" hidden>重试</button>
      <div id="page" data-page="sessions" aria-busy="true" hidden>
        <section class="card panel full-panel" aria-labelledby="sessions-title">
          <h2 id="sessions-title">所有演示会话</h2>
          <p class="meta">保存于当前标签页。切换会话后可查看历史或恢复未完成轮次。</p>
          <div class="filters">
            <label class="field grow" for="session-search"><span class="sr-only">搜索会话</span><input id="session-search" type="search" placeholder="搜索会话名称或 ID"></label>
            <label class="field" for="session-filter"><span class="sr-only">会话状态</span><select id="session-filter"></select></label>
            <form id="new-session-form" class="actions">
              <label class="field" for="new-session"><span class="sr-only">新会话名称</span><input id="new-session" maxlength="80" placeholder="新会话名称（可选）"></label>
              <button type="submit" class="primary" data-focus="new-session-submit">＋ 新建会话</button>
            </form>
          </div>
          <table class="record-table sessions-table" aria-labelledby="sessions-title">
            <thead><tr><th scope="col">会话</th><th scope="col">更新时间</th><th scope="col">状态</th><th scope="col">操作</th></tr></thead>
            <tbody id="session-list"></tbody>
          </table>
            <section class="inset session-detail" aria-labelledby="history-title">
              <h2 id="history-title">当前会话与历史</h2>
              <div class="stack">
                <dl id="session-summary" class="kv"></dl>
                <div class="actions"><a href="index.html" data-current-session>查看聊天历史</a><a href="context.html" data-current-session>查看上下文</a></div>
                <div id="recovery-action"></div>
              </div>
            </section>
        </section>
      </div>
      <noscript><p class="notice error">此演示需要启用 JavaScript。</p></noscript>
    </div>
    <footer>本地演示 · 不连接后端</footer>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description">
    <header class="dialog-head"><span class="dialog-mark" aria-hidden="true">!</span><div><h2 id="dialog-title"></h2><p id="dialog-description"></p></div><button type="button" id="dialog-close" class="icon-button" aria-label="关闭弹窗" autofocus>×</button></header>
    <div id="dialog-body"></div>
    <p id="dialog-error" class="notice error" role="alert" hidden></p>
    <div id="dialog-actions" class="actions dialog-actions"></div>
  </dialog>
</body>
</html>
