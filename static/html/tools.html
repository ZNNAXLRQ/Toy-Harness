<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>工具目录 · Toy Harness</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../css/tools.css">
  <script type="module" src="../js/app.js"></script>
</head>
<body>
  <a href="#main" class="skip" id="skip">跳至主要内容</a>
  <div id="sidebar-slot"></div>
  <main id="main" tabindex="-1">
    <header class="masthead">
      <div><h1 id="page-title" tabindex="-1">工具目录</h1><p>检查工具描述与参数 Schema；此处不能运行或注册工具。</p></div>
      <div class="header-tools"><label class="workspace" for="session-select"><span class="sr-only">当前会话</span><select id="session-select" disabled><option>加载中…</option></select></label><span class="badge mode">示例模式</span><span class="avatar" aria-hidden="true">U</span></div>
    </header>
    <div class="content">
      <div id="error" class="notice error" role="alert" hidden></div>
      <p id="storage-warning" class="notice error" role="alert" hidden>无法读取或保存标签页状态；此时换页或刷新可能丢失演示进度。</p>
      <div id="status" class="sr-only" role="status"></div>
      <p id="loading" class="empty">正在加载本地演示…</p>
      <button type="button" id="retry" hidden>重试</button>
      <div id="page" data-page="tools" aria-busy="true" hidden>
        <section class="card panel full-panel" aria-labelledby="tools-title">
          <h2 id="tools-title">已注册的示例工具</h2>
          <p class="meta">查看目录中的用途和实际演示行为；目录不提供工具执行。</p>
          <div class="filters"><label class="field grow" for="tool-search"><span class="sr-only">搜索工具</span><input id="tool-search" type="search" placeholder="搜索工具名称或描述"></label></div>
          <table class="record-table tools-table" aria-labelledby="tools-title">
            <thead><tr><th scope="col">工具</th><th scope="col">用途</th><th scope="col">审批</th><th scope="col">状态</th><th scope="col">参数</th></tr></thead>
            <tbody id="tool-list"></tbody>
          </table>
          <p class="panel-foot meta">演示规则：模拟更新便笺需要审批，批准后仍需手动恢复轮次。</p>
        </section>
      </div>
      <noscript><p class="notice error">此演示需要启用 JavaScript。</p></noscript>
    </div>
    <footer>本地演示 · 不连接后端</footer>
  </main>
</body>
</html>
