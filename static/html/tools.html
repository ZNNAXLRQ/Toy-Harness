<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>工具目录 · Toy Harness</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../css/tools.css">
  <script type="module" src="../js/app.js"></script>
</head>
<body>
  <a href="#main" class="skip" id="skip">跳至主要内容</a>
  <aside class="sidebar">
    <div class="brand"><span class="logo" aria-hidden="true">TH</span><strong>Toy Harness</strong></div>
    <p class="nav-label" id="workspace-name">演示工作区</p>
    <a class="button primary new-link" href="sessions.html#new-session">＋ 新建会话</a>
    <nav class="history-nav" aria-label="工作区会话历史" id="session-history"></nav>
    <nav class="task-nav" aria-label="工作台导航">
      <a href="approvals.html"><span class="nav-icon" aria-hidden="true">◇</span>审批</a>
      <a href="sessions.html"><span class="nav-icon" aria-hidden="true">▤</span>会话与恢复</a>
      <a href="checkpoints.html"><span class="nav-icon" aria-hidden="true">↶</span>检查点与回滚</a>
      <a href="subagents.html"><span class="nav-icon" aria-hidden="true">◎</span>子代理</a>
      <a href="tools.html" aria-current="page"><span class="nav-icon" aria-hidden="true">▦</span>工具目录</a>
      <a href="audit.html"><span class="nav-icon" aria-hidden="true">≡</span>审计日志</a>
      <a href="context.html"><span class="nav-icon" aria-hidden="true">◫</span>上下文与恢复</a>
    </nav>
    <a class="sidebar-foot" href="settings.html" aria-label="演示用户设置"><span class="avatar" aria-hidden="true">U</span><div><strong>演示用户</strong><small>本地工作区</small></div></a>
  </aside>
  <main id="main" tabindex="-1">
    <header class="masthead">
      <div><h1 id="page-title" tabindex="-1">只读工具目录</h1><p>检查工具描述与参数 Schema；此处不能运行或注册工具。</p></div>
      <div class="header-tools"><label class="workspace" for="session-select"><span class="sr-only">当前会话</span><select id="session-select" disabled><option>加载中…</option></select></label><span class="badge mode">示例模式</span><span class="avatar" aria-hidden="true">U</span></div>
    </header>
    <div class="content">
      <div id="error" class="notice error" role="alert" hidden></div>
      <p id="storage-warning" class="notice error" role="alert" hidden>无法读取或保存标签页状态；此时换页或刷新可能丢失演示进度。</p>
      <div id="status" class="sr-only" role="status"></div>
      <p id="loading" class="empty">正在加载本地演示…</p>
      <button type="button" id="retry" hidden>重试</button>
      <div id="page" data-page="tools" aria-busy="true" hidden>
        <section class="card panel full-panel" aria-labelledby="tools-title">
          <h2 id="tools-title">已注册的示例工具</h2>
          <p class="meta">查看目录中的用途和实际演示行为；目录不提供工具执行。</p>
          <div class="filters"><label class="field grow" for="tool-search"><span class="sr-only">搜索工具</span><input id="tool-search" type="search" placeholder="搜索工具名称或描述"></label></div>
          <table class="record-table tools-table" aria-labelledby="tools-title">
            <thead><tr><th scope="col">工具</th><th scope="col">用途</th><th scope="col">审批</th><th scope="col">状态</th><th scope="col">参数</th></tr></thead>
            <tbody id="tool-list"></tbody>
          </table>
          <p class="panel-foot meta">演示规则：模拟更新便笺需要审批，批准后仍需手动恢复轮次。</p>
        </section>
      </div>
      <noscript><p class="notice error">此演示需要启用 JavaScript。</p></noscript>
    </div>
    <footer>本地演示 · 不连接后端</footer>
  </main>
</body>
</html>
