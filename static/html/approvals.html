<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>审批 · Toy Harness</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../css/approvals.css">
  <script type="module" src="../js/app.js"></script>
</head>
<body>
  <a href="#main" class="skip" id="skip">跳至主要内容</a>
  <aside class="sidebar">
    <div class="brand"><span class="logo" aria-hidden="true">TH</span><strong>Toy Harness</strong></div>
    <p class="nav-label" id="workspace-name">演示工作区</p>
    <a class="button primary new-link" href="sessions.html#new-session">＋ 新建会话</a>
    <nav class="history-nav" aria-label="工作区会话历史" id="session-history"></nav>
    <nav class="task-nav" aria-label="工作台导航">
      <a href="approvals.html" aria-current="page"><span class="nav-icon" aria-hidden="true">◇</span>审批队列</a>
      <a href="sessions.html"><span class="nav-icon" aria-hidden="true">▤</span>会话与恢复</a>
      <a href="checkpoints.html"><span class="nav-icon" aria-hidden="true">↶</span>检查点与回滚</a>
      <a href="subagents.html"><span class="nav-icon" aria-hidden="true">◎</span>子代理</a>
      <a href="tools.html"><span class="nav-icon" aria-hidden="true">▦</span>工具目录</a>
      <a href="audit.html"><span class="nav-icon" aria-hidden="true">≡</span>审计日志</a>
      <a href="context.html"><span class="nav-icon" aria-hidden="true">◫</span>上下文与恢复</a>
    </nav>
    <a class="sidebar-foot" href="settings.html" aria-label="演示用户设置"><span class="avatar" aria-hidden="true">U</span><div><strong>演示用户</strong><small>本地工作区</small></div></a>
  </aside>
  <main id="main" tabindex="-1">
    <header class="masthead">
      <div><h1 id="page-title" tabindex="-1">审批队列</h1><p>记录批准或拒绝；决定本身不会派发工具。</p></div>
      <div class="header-tools"><label class="workspace" for="session-select"><span class="sr-only">当前会话</span><select id="session-select" disabled><option>加载中…</option></select></label><span class="badge mode">示例模式</span><span class="avatar" aria-hidden="true">U</span></div>
    </header>
    <div class="content">
      <div id="error" class="notice error" role="alert" hidden></div>
      <p id="storage-warning" class="notice error" role="alert" hidden>无法读取或保存标签页状态；此时换页或刷新可能丢失演示进度。</p>
      <div id="status" class="sr-only" role="status"></div>
      <p id="loading" class="empty">正在加载本地演示…</p>
      <button type="button" id="retry" hidden>重试</button>
      <div id="page" data-page="approvals" aria-busy="true" hidden>
        <section class="card panel" aria-labelledby="queue-title">
          <h2 id="queue-title">会话审批</h2>
          <div class="filters">
            <label class="field">会话范围<select id="approval-scope"><option value="all">全部会话</option><option value="current">当前会话</option></select></label>
            <label class="field" for="approval-filter">决定
            <select id="approval-filter">
              <option value="">全部记录</option><option value="pending">待决定</option>
              <option value="approved">已批准</option><option value="denied">已拒绝</option>
            </select>
          </label></div>
          <div id="approval-list" class="stack"></div>
        </section>
      </div>
      <noscript><p class="notice error">此演示需要启用 JavaScript。</p></noscript>
    </div>
    <footer>本地演示 · 不连接后端</footer>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description">
    <header class="dialog-head"><span class="dialog-mark" aria-hidden="true">!</span><div><h2 id="dialog-title"></h2><p id="dialog-description"></p></div><button type="button" id="dialog-close" class="icon-button" aria-label="关闭弹窗" autofocus>×</button></header>
    <div id="dialog-body"></div>
    <p id="dialog-error" class="notice error" role="alert" hidden></p>
    <div id="dialog-actions" class="actions dialog-actions"></div>
  </dialog>
</body>
</html>
