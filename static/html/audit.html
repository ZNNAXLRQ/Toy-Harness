<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>审计日志 · Toy Harness</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../css/audit.css">
  <script type="module" src="../js/app.js"></script>
</head>
<body>
  <a href="#main" class="skip" id="skip">跳至主要内容</a>
  <div id="sidebar-slot"></div>
  <main id="main" tabindex="-1">
    <header class="masthead">
      <div><h1 id="page-title" tabindex="-1">审计日志</h1><p>查看会话创建、审批决策、子代理和回滚记录。</p></div>
      <div class="header-tools"><label class="workspace" for="session-select"><span class="sr-only">当前会话</span><select id="session-select" disabled><option>加载中…</option></select></label><span class="badge mode">示例模式</span><span class="avatar" aria-hidden="true">U</span></div>
    </header>
    <div class="content">
      <div id="error" class="notice error" role="alert" hidden></div>
      <p id="storage-warning" class="notice error" role="alert" hidden>无法读取或保存标签页状态；此时换页或刷新可能丢失演示进度。</p>
      <div id="status" class="sr-only" role="status"></div>
      <p id="loading" class="empty">正在加载本地演示…</p>
      <button type="button" id="retry" hidden>重试</button>
      <div id="page" data-page="audit" aria-busy="true" hidden>
        <section class="card panel full-panel" aria-labelledby="audit-title">
          <h2 id="audit-title">审计记录</h2>
          <p class="meta">只读历史 · 最新记录在前</p>
          <div class="filters">
            <label class="field grow" for="audit-search"><span class="sr-only">搜索审计</span><input id="audit-search" type="search" placeholder="搜索操作者、动作或会话"></label>
            <label class="field" for="audit-scope"><span class="sr-only">会话范围</span><select id="audit-scope"><option value="all">全部会话</option><option value="current">当前会话</option></select></label>
            <label class="field" for="audit-action"><span class="sr-only">动作</span><select id="audit-action"></select></label>
          </div>
          <table class="record-table audit-table" aria-labelledby="audit-title">
            <thead><tr><th scope="col">时间</th><th scope="col">操作者</th><th scope="col">动作</th><th scope="col">会话与详情</th><th scope="col">结果</th></tr></thead>
            <tbody id="audit-list"></tbody>
          </table>
          <p class="panel-foot meta">记录仅来自本地演示，不会上传或同步。</p>
        </section>
      </div>
      <noscript><p class="notice error">此演示需要启用 JavaScript。</p></noscript>
    </div>
    <footer>本地演示 · 不连接后端</footer>
  </main>
</body>
</html>
