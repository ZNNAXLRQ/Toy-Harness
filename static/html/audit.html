    <header class="masthead"><span>工作空间 <span class="slash" aria-hidden="true">/</span> <strong>审计日志</strong></span><span class="badge mode"><span class="dot" aria-hidden="true"></span> 示例模式</span></header>
    <div class="content">
      <header class="page-head"><p class="eyebrow">TOY HARNESS / WORKBENCH</p><h1 id="page-title" tabindex="-1">审计日志</h1><p>查看会话创建、审批决策、子代理和回滚记录。</p></header>

          <div class="filters">
            <label class="field" for="audit-scope">会话范围<select id="audit-scope"><option value="current">当前会话</option><option value="all">所有会话</option></select></label>
            <label class="field" for="audit-action">动作<select id="audit-action"></select></label>
          </div>
          <div id="audit-list" class="stack"></div>
        </section>
      </div>
