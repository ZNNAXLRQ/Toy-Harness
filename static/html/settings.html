<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>设置 · Toy Harness</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../css/settings.css">
  <script type="module" src="../js/app.js"></script>
</head>
<body>
  <a href="#main" class="skip" id="skip">跳至主要内容</a>
  <div id="sidebar-slot"></div>
  <main id="main" tabindex="-1">
    <header class="masthead">
      <div><h1 id="page-title" tabindex="-1">设置</h1><p>展示配置字段的示例默认值；不读取本机配置，不接受或保存密钥。</p></div>
      <div class="header-tools"><label class="workspace" for="session-select"><span class="sr-only">当前会话</span><select id="session-select" disabled><option>加载中…</option></select></label><span class="badge mode">示例模式</span><span class="avatar" aria-hidden="true">U</span></div>
    </header>
    <div class="content">
      <div id="error" class="notice error" role="alert" hidden></div>
      <p id="storage-warning" class="notice error" role="alert" hidden>无法读取或保存标签页状态；此时换页或刷新可能丢失演示进度。</p>
      <div id="status" class="sr-only" role="status"></div>
      <p id="loading" class="empty">正在加载本地演示…</p>
      <button type="button" id="retry" hidden>重试</button>
      <div id="page" data-page="settings" aria-busy="true" hidden>
        <div class="stack">
          <div class="actions" role="tablist" aria-label="设置分组">
            <button type="button" id="llm-tab" role="tab" aria-controls="llm-panel" aria-selected="true">模型配置</button>
            <button type="button" id="runtime-tab" role="tab" aria-controls="runtime-panel" aria-selected="false" tabindex="-1">运行环境</button>
          </div>
          <section class="card panel" id="llm-panel" role="tabpanel" aria-labelledby="llm-tab" tabindex="0"><h2>模型配置</h2><dl id="llm-config" class="kv"></dl></section>
          <section class="card panel" id="runtime-panel" role="tabpanel" aria-labelledby="runtime-tab" tabindex="0" hidden><h2>运行环境</h2><dl id="runtime-config" class="kv"></dl></section>
        </div>
      </div>
      <noscript><p class="notice error">此演示需要启用 JavaScript。</p></noscript>
    </div>
    <footer>本地演示 · 不连接后端</footer>
  </main>
</body>
</html>
